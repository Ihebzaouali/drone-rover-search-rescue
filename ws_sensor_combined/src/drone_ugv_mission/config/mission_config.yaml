# mission_config.yaml
# ====================
# Central configuration for the drone-UGV mission package.
# Edit this file to adapt to your setup — no code changes needed.

person_locator_node:
  ros__parameters:
    use_sim_time: true

    # ── Detection ────────────────────────────────────────────────────────────
    # Topic your detection code publishes std_msgs/Bool on.
    # Change this to match your detection node's output topic.
    detection_topic: /drone/person_detected

    # Minimum seconds between consecutive goal publications.
    # Prevents the robot from being re-targeted every frame.
    publish_cooldown_sec: 3.0

robot_mission_node:
  ros__parameters:
    use_sim_time: true

    # ── Topics ───────────────────────────────────────────────────────────────
    # Must match person_locator_node's output topic.
    person_pose_topic: /detected_person_pose

    # Nav2 action server name.
    # Only change if you remapped it in your nav2_bringup launch file.
    nav2_action_server: navigate_to_pose
