ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Wheel odometry — trust velocities only
    odom0: /model/ugv/odometry
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]

    # IMU — trust ONLY yaw and angular velocity around Z
    imu0: /model/ugv/imu
    imu0_config: [false, false, false,
                  false, false, true,     # yaw only, NOT roll/pitch
                  false, false, false,
                  false, false, true,     # vyaw only
                  false, false, false]    # NO acceleration at all
    imu0_differential: false
    imu0_relative: false                  # absolute orientation
    imu0_remove_gravitational_acceleration: true   
    use_control: false
